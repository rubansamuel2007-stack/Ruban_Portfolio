<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Ruban.S</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin auth">
  <form class="auth-card" method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="brand-mark big">R</div>
    <h1>Admin login</h1>
    <p class="muted">Sign in to manage your portfolio.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus maxlength="40">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary block" type="submit"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
    <a class="back" href="{{ url_for('public.index') }}">&larr; Back to website</a>
  </form>
</body>
</html>
