{% extends "base.html" %}
{% block title %}{{ title }} | {{ S.site_title }}{% endblock %}
{% block content %}
<section class="section error-page">
  <div class="container narrow center">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="section-sub">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.index') }}"><i class="bi bi-house"></i> Back to home</a>
  </div>
</section>
{% endblock %}
